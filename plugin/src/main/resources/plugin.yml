name: DokodemoDoor
version: 1.0.0
main: top.midream.ddoor.DDoorPlugin
api-version: '1.21'
authors: [qs5668]
description: Pair-based cross-world door portals — place two doors, link with a key, walk through.
website: https://dokodemodoor.plugin.midream.top
folia-supported: false

commands:
  ddoor:
    description: DokodemoDoor management command
    usage: /ddoor <list|tp|rename|unlink|delete|key|stats|reload>
    aliases: [doko, anydoor]

permissions:
  ddoor.use:
    description: Walk through doors
    default: true
  ddoor.create:
    description: Link doors with a key
    default: true
  ddoor.gui:
    description: Open management GUI (reserved)
    default: true
  ddoor.list:
    description: List own door pairs
    default: true
  ddoor.list.others:
    description: List all server doors with -a
    default: op
  ddoor.link.command:
    description: Link doors via command without a key
    default: op
  ddoor.tp:
    description: Teleport to a named door
    default: op
  ddoor.rename:
    description: Rename a door
    default: true
  ddoor.unlink:
    description: Unlink own door pair
    default: true
  ddoor.delete:
    description: Delete door records
    default: op
  ddoor.admin:
    description: Manage all pairs, give keys, reload
    default: op
  ddoor.bypass.cooldown:
    description: Skip teleport cooldown
    default: op
  ddoor.bypass.world:
    description: Skip world blacklist/whitelist
    default: op
