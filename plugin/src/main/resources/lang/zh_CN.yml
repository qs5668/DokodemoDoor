# DDoor 中文文案（支持 MiniMessage）
prefix: "<gradient:#b388ff:#6ea8fe><b>任意门</b></gradient> <dark_gray>»</dark_gray> <gray>"

key:
  name: "<bold><gradient:#b388ff:#6ea8fe>门之钥</gradient></bold>"
  lore:
    - "<dark_gray>右键两扇门，将它们配对</dark_gray>"
    - "<dark_gray>配对成功后消耗 1 把</dark_gray>"
key-entity:
  name: "<bold><gradient:#34d399:#6ea8fe>门之钥·实体</gradient></bold>"
  lore:
    - "<dark_gray>右键两扇门，将它们配对</dark_gray>"
    - "<dark_gray>配对的门 玩家与生物 均可穿越</dark_gray>"
    - "<dark_gray>门对时限: {hours}（配对时开始计时）</dark_gray>"
    - "<dark_gray>钥匙本身不会过期，闲置可一直保存</dark_gray>"
    - "<dark_gray>配对成功后消耗 1 把</dark_gray>"
  hours: "<gold>{hours}</gold> 小时"
  permanent: "永久"

link:
  first-selected: "<green>已选中第一扇门，请在 <gold>{seconds}</gold> 秒内右键第二扇门完成配对</green>"
  first-selected-entity: "<green>已选中第一扇门（实体门），请在 <gold>{seconds}</gold> 秒内用<gold>门之钥·实体</gold>右键第二扇门</green>"
  second-selected: "<green>配对成功！两扇门已互通——<gold>{name}</gold></green>"
  second-selected-entity: "<green>配对成功！<gold>{name}</gold>——玩家与生物均可穿越，门对时限 {hours}</green>"
  key-mismatch: "<red>请使用相同类型的门之钥完成配对（普通钥配普通门，实体钥配实体门）</red>"
  no-permission: "<red>你没有创建任意门的权限</red>"
  timeout: "<red>配对超时，会话已取消</red>"
  same-door: "<red>不能把门和它自己配对</red>"
  already-paired: "<yellow>这扇门已配对——重新绑定将解除旧配对</yellow>"
  already-paired-confirm: "<yellow>已解除旧配对，这扇门现在可以重新绑定</yellow>"
  limit-reached: "<red>你的门对数量已达上限（<gold>{limit}</gold> 对）</red>"
  world-denied: "<red>这个世界不允许创建任意门</red>"
  not-a-door: "<red>请右键一扇「门」方块</red>"
  unlink-cooldown: "<red>这扇门刚被解绑，需等待 <gold>{seconds}</gold> 秒后才能重新绑定</red>"
  session-cancelled: "<gray>已取消当前配对会话</gray>"
  mode-start: "<green>免钥匙绑定模式：右键第一扇门，再右键第二扇门（<gold>{seconds}</gold> 秒内有效），再次输入 /ddoor link 取消</green>"

tp:
  cooldown: "<red>传送冷却中，请稍候…</red>"
  in-vehicle: "<red>骑乘状态下无法穿越任意门，请先离开载具</red>"
  no-permission: "<red>你没有使用任意门的权限</red>"
  pair-broken: "<red>对侧门已失效，本门已转为未配对状态</red>"
  pair-broken-detail: "<red>对侧门「<gold>{name}</gold>」在 <white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray> 已被破坏或移除，配对已解除</red>"
  disabled: "<red>门对「<gold>{name}</gold>」已被门主停用</red>"
  pair-expired: "<red>门对「<gold>{name}</gold>」的时限已到，配对已自动解除</red>"
  world-denied: "<red>目标世界已被禁用</red>"
  world-denied-detail: "<red>目标世界 <white>{world}</white> 已被禁用</red>"
  unsafe: "<red>对侧落点异常（被方块围堵），传送取消</red>"
  unsafe-detail: "<red>落点不安全：<gray>{detail}</gray>，传送取消</red>"
  unsafe-blocked-feet: "<white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray> 的 <gold>{block}</gold> 挡住了落脚空间"
  unsafe-blocked-head: "<white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray> 的 <gold>{block}</gold> 挡住了头部空间"
  unsafe-no-floor: "<white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray> 下方没有支撑方块（悬空）"
  in-vehicle: "<red>请先离开载具再穿门</red>"
  success: "<light_purple>穿过任意门 → {world}</light_purple>"
  economy-failed: "<red>余额不足（需要 {cost}）</red>"
  charged: "<gray>-{cost}</gray>"

unlink:
  done: "<yellow>已解除配对：<gold>{name}</gold></yellow>"
  notify-owner: "<yellow>你的门「<gold>{name}</gold>」的配对被解除</yellow>"
  expired-owner: "<yellow>你的门对「<gold>{name}</gold>」时限已到，配对已自动解除（门方块保留，可重新绑定）</yellow>"

break:
  notify-owner: "<yellow>你的门「<gold>{name}</gold>」被破坏，其配对已解除</yellow>"

cmd:
  no-permission: "<red>你没有权限执行此操作</red>"
  not-found: "<red>未找到名为「<gold>{name}</gold>」的门</red>"
  player-only: "<red>此命令仅玩家可用</red>"
  player-offline: "<red>玩家不在线</red>"
  invalid-hours: "<red>无效的时限：请输入 0~100000 之间的整数小时（0 = 永久）</red>"
  reloaded: "<green>配置与文案已重载（数据未受影响）</green>"
  renamed: "<green>已重命名：<old> → <gold>{name}</gold></green>"
  rename-length: "<red>门名长度需在 1~16 字符之间</red>"
  deleted: "<green>已删除门记录：<gold>{name}</gold></green>"
  key-given: "<green>已向 <gold>{player}</gold> 发放 <gold>{amount}</gold> 把门之钥</green>"
  key-given-entity: "<green>已向 <gold>{player}</gold> 发放 <gold>{amount}</gold> 把门之钥·实体（门对时限 {lifetime}）</green>"
  key-received: "<green>获得 <gold>{amount}</gold> 把门之钥</green>"
  key-received-entity: "<green>获得 <gold>{amount}</gold> 把门之钥·实体——门对时限 {lifetime}，钥匙闲置不会过期</green>"
  list-header: "<gray>── 门对列表（<gold>{count}</gold>）──</gray>"
  list-row: "<gray>{index}. <gold>{name}</gold> <dark_gray>({world_a} ↔ {world_b} · {uses} 次)</dark_gray></gray>"
  list-empty: "<gray>还没有门对。放两扇门，用门之钥依次右键即可创建！</gray>"
  stats-mine-header: "<gray>── 我的统计 ──</gray>"
  stats-mine: "<gray>门对: <gold>{pairs}</gold><dark_gray>/{limit}</dark_gray> · 累计穿越: <gold>{uses}</gold></gray>"
  stats-mine-line2: "<gray>传送方式: <gold>{mode}</gold> · 信息显示: <gold>{info}</gold> · 交互记录见 /ddoor gui</gray>"
  stats-header: "<gray>── 全服统计 ──</gray>"
  stats-total: "<gray>门对总数: <gold>{pairs}</gold> · 门总数: <gold>{doors}</gold> · 累计穿越: <gold>{uses}</gold></gray>"
  usage-header: "<gray>── /ddoor 命令 ──</gray>"
  usage-list: "<gray>/ddoor list{flags} <dark_gray>— 门对列表</dark_gray></gray>"
  usage-tp: "<gray>/ddoor tp <门名> <dark_gray>— 传送到门</dark_gray></gray>"
  usage-rename: "<gray>/ddoor rename <门名> <新名> <dark_gray>— 重命名</dark_gray></gray>"
  usage-unlink: "<gray>/ddoor unlink <门名> <dark_gray>— 解除配对</dark_gray></gray>"
  usage-link: "<gray>/ddoor link <dark_gray>— 免钥匙绑定模式（右键两扇门）</dark_gray></gray>"
  usage-gui: "<gray>/ddoor gui <dark_gray>— 打开门对管理菜单（详情/设置/记录）</dark_gray></gray>"
  usage-admin: "<gray>/ddoor delete <门名> · key [normal|entity <小时>] [数量] [玩家] · stats · reload</gray>"

gui:
  title: "<gradient:#b388ff:#6ea8fe>任意门 · 我的门对</gradient> <dark_gray>({page}/{pages})</dark_gray>"
  door-name: "<gold>{name}</gold>"
  door-lore:
    - "<gray>A端:</gray> <white>{world_a}</white> <dark_gray>({x_a}, {y_a}, {z_a} · 朝{facing_a} · {biome_a})</dark_gray>"
    - "<gray>B端:</gray> <white>{world_b}</white> <dark_gray>({x_b}, {y_b}, {z_b} · 朝{facing_b} · {biome_b})</dark_gray>"
    - "<gray>创建于</gray> <white>{created}</white> <gray>· 累计穿越</gray> <white>{uses}</white> <gray>次</gray>"
    - "<gray>实体穿越:</gray> {entities}"
    - "<gray>门对时限:</gray> {expires}"
    - ""
    - "<yellow>左键</yellow> <gray>传送到此门</gray>"
    - "<yellow>右键</yellow> <gray>详情与设置</gray>"
    - "<red>Shift+右键</red> <gray>解除配对</gray>"
  door-lore-simple:
    - "<white>{world_a}</white> <dark_gray>↔</dark_gray> <white>{world_b}</white> <dark_gray>· {uses} 次</dark_gray>"
    - ""
    - "<yellow>左键</yellow> <gray>传送</gray> <dark_gray>·</dark_gray> <yellow>右键</yellow> <gray>设置</gray>"
  empty-name: "<gray>还没有门对</gray>"
  empty-lore:
    - "<gray>放两扇门，手持门之钥依次右键</gray>"
    - "<gray>即可让它们互通</gray>"
  prev-name: "<yellow>← 上一页</yellow>"
  next-name: "<yellow>下一页 →</yellow>"
  back-name: "<yellow>← 返回</yellow>"
  close-name: "<red>关闭</red>"
  stats-name: "<gradient:#b388ff:#6ea8fe>我的统计</gradient>"
  stats-lore:
    - "<gray>门对:</gray> <white>{count}</white><dark_gray>/{limit}</dark_gray>"
    - "<gray>累计穿越:</gray> <white>{uses}</white>"
  settings-name: "<gradient:#b388ff:#6ea8fe>个人设置</gradient>"
  settings-lore:
    - "<gray>传送触发方式 / 信息显示</gray>"
    - "<yellow>点击打开</yellow>"
  settings-title: "<gradient:#b388ff:#6ea8fe>任意门 · 个人设置</gradient>"
  mode-name: "<gold>传送触发方式</gold>"
  mode-lore:
    - "<gray>当前:</gray> <white>{mode}</white>"
    - ""
    - "<gray>走近: 走进门框即传送（默认）</gray>"
    - "<gray>右键: 对门右键点击传送</gray>"
    - "<gray>左键: 对门左键点击传送（潜行=原版操作）</gray>"
    - ""
    - "<yellow>点击切换</yellow>"
  mode-walk: "走近传送"
  mode-right: "右键传送"
  mode-left: "左键传送"
  mode-set: "<green>传送触发方式已切换为：<gold>{mode}</gold></green>"
  info-mode-name: "<gold>信息显示</gold>"
  info-mode-detailed: "详细模式"
  info-mode-simple: "简化模式"
  info-mode-detailed-lore:
    - "<gray>当前:</gray> <white>详细模式</white>"
    - "<gray>完整坐标 / 朝向 / 群系 / 详细报错</gray>"
    - ""
    - "<yellow>点击切换为简化模式</yellow>"
  info-mode-simple-lore:
    - "<gray>当前:</gray> <white>简化模式</white>"
    - "<gray>精简门对信息 / 只报简要错误</gray>"
    - ""
    - "<yellow>点击切换为详细模式</yellow>"
  info-mode-set: "<green>信息显示已切换为：<gold>{mode}</gold></green>"
  detail-title: "<gradient:#b388ff:#6ea8fe>任意门 · {name}</gradient>"
  detail-end-a: "<gold>A端 · 此门</gold>"
  detail-end-b: "<gold>B端 · 对侧门</gold>"
  detail-end-lore:
    - "<gray>世界:</gray> <white>{world}</white>"
    - "<gray>坐标:</gray> <white>{x}, {y}, {z}</white> <dark_gray>(朝{facing})</dark_gray>"
    - "<gray>群系:</gray> <white>{biome}</white>"
    - "<gray>此端穿越:</gray> <white>{uses}</white> <gray>次</gray>"
  detail-info-name: "<gradient:#b388ff:#6ea8fe>{name}</gradient>"
  detail-info-lore:
    - "<gray>创建于:</gray> <white>{created}</white>"
    - "<gray>累计穿越:</gray> <white>{uses}</white> <gray>次</gray>"
    - "<gray>实体穿越:</gray> {entities}"
    - "<gray>门对时限:</gray> {expires}"
    - "<gray>状态:</gray> {status}"
  status-enabled: "<green>启用中</green>"
  status-disabled: "<red>已停用</red>"
  entity-on: "<green>支持（玩家与生物）</green>"
  entity-off: "<dark_gray>仅玩家</dark_gray>"
  expires-permanent: "<dark_gray>永久</dark_gray>"
  expires-hours: "<gold>{hours}</gold> 小时"
  expires-minutes: "<gold>{minutes}</gold> 分钟"
  facing-north: "北"
  facing-south: "南"
  facing-east: "东"
  facing-west: "西"
  detail-tp-a-name: "<aqua>传送 → A端</aqua>"
  detail-tp-b-name: "<aqua>传送 → B端</aqua>"
  detail-tp-lore:
    - "<gray>目标:</gray> <white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray>"
    - "<yellow>点击传送</yellow>"
  detail-rename-name: "<yellow>重命名</yellow>"
  detail-rename-lore:
    - "<gray>关闭菜单后在聊天栏输入新名称</gray>"
    - "<yellow>点击开始</yellow>"
  detail-toggle-on-name: "<green>门对状态：启用中</green>"
  detail-toggle-on-lore:
    - "<gray>当前允许传送</gray>"
    - "<red>点击停用（暂停传送，不删除门）</red>"
  detail-toggle-off-name: "<red>门对状态：已停用</red>"
  detail-toggle-off-lore:
    - "<gray>当前禁止传送</gray>"
    - "<green>点击启用</green>"
  toggle-on-done: "<green>门对「<gold>{name}</gold>」已启用</green>"
  toggle-off-done: "<yellow>门对「<gold>{name}</gold>」已停用，传送暂时关闭</yellow>"
  detail-unlink-name: "<red>解除配对</red>"
  detail-unlink-lore:
    - "<gray>两扇门解除连接，门方块保留</gray>"
    - "<gray>之后可用门之钥重新配对</gray>"
    - "<red>点击解除</red>"
  detail-logs-name: "<light_purple>交互记录</light_purple>"
  detail-logs-lore:
    - "<gray>谁、何时、做过什么</gray>"
    - "<gray>（传送 / 配对 / 解绑 / 破坏）</gray>"
    - "<yellow>点击查看</yellow>"
  rename-prompt: "<yellow>请在聊天栏输入新名称（1~16 字符），输入 <gold>cancel</gold> 取消</yellow>"
  rename-cancelled: "<gray>已取消重命名</gray>"
  logs-title: "<gradient:#b388ff:#6ea8fe>交互记录 · {name}</gradient> <dark_gray>({page}/{pages})</dark_gray>"
  key-name: "<bold><gradient:#b388ff:#6ea8fe>门之钥</gradient></bold>"
  key-lore:
    - "<gray>右键两扇门，将它们配对</gray>"
    - "<gray>合成:</gray> <white>紫晶×4 + 铁锭×4 + 末影之眼×1</white>"
    - "<gray>配方已解锁至配方书</gray>"

logs:
  disabled: "<gray>交互记录功能已被管理员关闭</gray>"
  empty: "<gray>最近没有交互记录</gray>"
  action-teleport: "<light_purple>传送</light_purple>"
  action-link: "<green>配对</green>"
  action-unlink: "<yellow>解绑</yellow>"
  action-break: "<red>破坏</red>"
  entry-lore:
    - "<gray>操作:</gray> {action}"
    - "<gray>时间:</gray> <white>{time}</white>"
    - "<gray>位置:</gray> <white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray>"

audit:
  cleaned: "<gray>对账完成：清理 {count} 条失配门记录</gray>"
