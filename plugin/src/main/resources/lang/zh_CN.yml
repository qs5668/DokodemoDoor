# DDoor 中文文案（支持 MiniMessage）
prefix: "<gradient:#b388ff:#6ea8fe><b>任意门</b></gradient> <dark_gray>»</dark_gray> <gray>"

key:
  name: "<bold><gradient:#b388ff:#6ea8fe>门之钥</gradient></bold>"
  lore:
    - "<dark_gray>右键两扇门，将它们配对</dark_gray>"
    - "<dark_gray>配对成功后消耗 1 把</dark_gray>"

link:
  first-selected: "<green>已选中第一扇门，请在 <gold>{seconds}</gold> 秒内右键第二扇门完成配对</green>"
  second-selected: "<green>配对成功！两扇门已互通——<gold>{name}</gold></green>"
  timeout: "<red>配对超时，会话已取消</red>"
  same-door: "<red>不能把门和它自己配对</red>"
  already-paired: "<yellow>这扇门已配对——重新绑定将解除旧配对</yellow>"
  already-paired-confirm: "<yellow>已解除旧配对，这扇门现在可以重新绑定</yellow>"
  limit-reached: "<red>你的门对数量已达上限（<gold>{limit}</gold> 对）</red>"
  world-denied: "<red>这个世界不允许创建任意门</red>"
  not-a-door: "<red>请右键一扇「门」方块</red>"
  unlink-cooldown: "<red>这扇门刚被解绑，需等待 <gold>{seconds}</gold> 秒后才能重新绑定</red>"
  session-cancelled: "<gray>已取消当前配对会话</gray>"
  mode-start: "<green>免钥匙绑定模式：右键第一扇门，再右键第二扇门（<gold>{seconds}</gold> 秒内有效），再次输入 /ddoor link 取消</green>"

tp:
  cooldown: "<red>传送冷却中，请稍候…</red>"
  no-permission: "<red>你没有使用任意门的权限</red>"
  pair-broken: "<red>对侧门已失效，本门已转为未配对状态</red>"
  world-denied: "<red>目标世界已被禁用</red>"
  unsafe: "<red>对侧落点异常（被方块围堵），传送取消</red>"
  in-vehicle: "<red>请先离开载具再穿门</red>"
  success: "<light_purple>穿过任意门 → {world}</light_purple>"
  economy-failed: "<red>余额不足（需要 {cost}）</red>"
  charged: "<gray>-{cost}</gray>"

unlink:
  done: "<yellow>已解除配对：<gold>{name}</gold></yellow>"
  notify-owner: "<yellow>你的门「<gold>{name}</gold>」的配对被解除</yellow>"

break:
  notify-owner: "<yellow>你的门「<gold>{name}</gold>」被破坏，其配对已解除</yellow>"

cmd:
  no-permission: "<red>你没有权限执行此操作</red>"
  not-found: "<red>未找到名为「<gold>{name}</gold>」的门</red>"
  player-only: "<red>此命令仅玩家可用</red>"
  player-offline: "<red>玩家不在线</red>"
  reloaded: "<green>配置与文案已重载（数据未受影响）</green>"
  renamed: "<green>已重命名：<old> → <gold>{name}</gold></green>"
  rename-length: "<red>门名长度需在 1~16 字符之间</red>"
  deleted: "<green>已删除门记录：<gold>{name}</gold></green>"
  key-given: "<green>已向 <gold>{player}</gold> 发放 <gold>{amount}</gold> 把门之钥</green>"
  key-received: "<green>获得 <gold>{amount}</gold> 把门之钥</green>"
  list-header: "<gray>── 门对列表（<gold>{count}</gold>）──</gray>"
  list-row: "<gray>{index}. <gold>{name}</gold> <dark_gray>({world_a} ↔ {world_b} · {uses} 次)</dark_gray></gray>"
  list-empty: "<gray>还没有门对。放两扇门，用门之钥依次右键即可创建！</gray>"
  stats-header: "<gray>── 全服统计 ──</gray>"
  stats-total: "<gray>门对总数: <gold>{pairs}</gold> · 门总数: <gold>{doors}</gold> · 累计穿越: <gold>{uses}</gold></gray>"
  usage-header: "<gray>── /ddoor 命令 ──</gray>"
  usage-list: "<gray>/ddoor list{flags} <dark_gray>— 门对列表</dark_gray></gray>"
  usage-tp: "<gray>/ddoor tp <门名> <dark_gray>— 传送到门</dark_gray></gray>"
  usage-rename: "<gray>/ddoor rename <门名> <新名> <dark_gray>— 重命名</dark_gray></gray>"
  usage-unlink: "<gray>/ddoor unlink <门名> <dark_gray>— 解除配对</dark_gray></gray>"
  usage-link: "<gray>/ddoor link <dark_gray>— 免钥匙绑定模式（右键两扇门）</dark_gray></gray>"
  usage-gui: "<gray>/ddoor gui <dark_gray>— 打开门对管理菜单</dark_gray></gray>"
  usage-admin: "<gray>/ddoor delete <门名> · key [数量] [玩家] · stats · reload</gray>"

gui:
  title: "<gradient:#b388ff:#6ea8fe>任意门 · 我的门对</gradient> <dark_gray>({page}/{pages})</dark_gray>"
  door-name: "<gold>{name}</gold>"
  door-lore:
    - "<gray>A端:</gray> <white>{world_a}</white> <dark_gray>({x_a}, {y_a}, {z_a})</dark_gray>"
    - "<gray>B端:</gray> <white>{world_b}</white> <dark_gray>({x_b}, {y_b}, {z_b})</dark_gray>"
    - "<gray>累计穿越:</gray> <white>{uses}</white> <gray>次</gray>"
    - ""
    - "<yellow>左键</yellow> <gray>传送到此门</gray>"
    - "<red>Shift+右键</red> <gray>解除配对</gray>"
  empty-name: "<gray>还没有门对</gray>"
  empty-lore:
    - "<gray>放两扇门，手持门之钥依次右键</gray>"
    - "<gray>即可让它们互通</gray>"
  prev-name: "<yellow>← 上一页</yellow>"
  next-name: "<yellow>下一页 →</yellow>"
  stats-name: "<gradient:#b388ff:#6ea8fe>我的统计</gradient>"
  stats-lore:
    - "<gray>门对:</gray> <white>{count}</white><dark_gray>/{limit}</dark_gray>"
    - "<gray>累计穿越:</gray> <white>{uses}</white>"
  close-name: "<red>关闭</red>"
  key-name: "<bold><gradient:#b388ff:#6ea8fe>门之钥</gradient></bold>"
  key-lore:
    - "<gray>右键两扇门，将它们配对</gray>"
    - "<gray>合成:</gray> <white>紫晶×4 + 铁锭×4 + 末影之眼×1</white>"

audit:
  cleaned: "<gray>对账完成：清理 {count} 条失配门记录</gray>"
