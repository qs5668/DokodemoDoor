# DDoor English messages (MiniMessage supported)
prefix: "<gradient:#b388ff:#6ea8fe><b>DokodemoDoor</b></gradient> <dark_gray>»</dark_gray> <gray>"

key:
  name: "<bold><gradient:#b388ff:#6ea8fe>Door Key</gradient></bold>"
  lore:
    - "<dark_gray>Right-click two doors to link them</dark_gray>"
    - "<dark_gray>Consumes 1 key on success</dark_gray>"
key-entity:
  name: "<bold><gradient:#34d399:#6ea8fe>Door Key (Entity)</gradient></bold>"
  lore:
    - "<dark_gray>Right-click two doors to link them</dark_gray>"
    - "<dark_gray>Linked doors carry players and mobs</dark_gray>"
    - "<dark_gray>Pair lifetime: {hours} (starts on linking)</dark_gray>"
    - "<dark_gray>The key itself never expires while unused</dark_gray>"
    - "<dark_gray>Consumes 1 key on success</dark_gray>"
  hours: "<gold>{hours}</gold>h"
  permanent: "permanent"

link:
  first-selected: "<green>First door selected. Right-click the second door within <gold>{seconds}</gold>s</green>"
  first-selected-entity: "<green>First door selected (entity pair). Use a <gold>Door Key (Entity)</gold> on the second door within <gold>{seconds}</gold>s</green>"
  second-selected: "<green>Linked! The doors are now connected — <gold>{name}</gold></green>"
  second-selected-entity: "<green>Linked! <gold>{name}</gold> — players and mobs may pass · pair lifetime {hours}</green>"
  key-mismatch: "<red>Finish the pair with the same key type (normal key for normal pairs, entity key for entity pairs)</red>"
  no-permission: "<red>You don't have permission to create door pairs</red>"
  timeout: "<red>Pairing session timed out</red>"
  same-door: "<red>A door cannot pair with itself</red>"
  already-paired: "<yellow>This door is already paired — re-linking will break the old pair</yellow>"
  already-paired-confirm: "<yellow>Old pair broken. This door is ready to re-link</yellow>"
  limit-reached: "<red>You reached your pair limit (<gold>{limit}</gold>)</red>"
  world-denied: "<red>Doors are not allowed in this world</red>"
  not-a-door: "<red>Right-click a door block</red>"
  unlink-cooldown: "<red>This door was just unlinked — wait <gold>{seconds}</gold>s to re-link</red>"
  session-cancelled: "<gray>Pairing session cancelled</gray>"
  mode-start: "<green>Keyless linking: right-click the first door, then the second (within <gold>{seconds}</gold>s). /ddoor link again to cancel</green>"

tp:
  cooldown: "<red>Teleport cooldown, please wait…</red>"
  no-permission: "<red>You cannot use door portals</red>"
  pair-broken: "<red>The other door is gone — this door is now unpaired</red>"
  pair-broken-detail: "<red>The other door「<gold>{name}</gold>」at <white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray> was broken or removed — pair dissolved</red>"
  disabled: "<red>Pair「<gold>{name}</gold>」is disabled by its owner</red>"
  pair-expired: "<red>Pair「<gold>{name}</gold>」ran out of lifetime — it has been unlinked automatically</red>"
  world-denied: "<red>The destination world is disabled</red>"
  world-denied-detail: "<red>The destination world <white>{world}</white> is disabled</red>"
  unsafe: "<red>The landing spot is blocked — teleport cancelled</red>"
  unsafe-detail: "<red>Unsafe landing: <gray>{detail}</gray> — teleport cancelled</red>"
  unsafe-blocked-feet: "<gold>{block}</gold> at <white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray> blocks the feet space"
  unsafe-blocked-head: "<gold>{block}</gold> at <white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray> blocks the head space"
  unsafe-no-floor: "no solid floor below <white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray> (mid-air)"
  in-vehicle: "<red>Leave your vehicle before entering the door</red>"
  success: "<light_purple>Through the door → {world}</light_purple>"
  economy-failed: "<red>Not enough funds (needs {cost})</red>"
  charged: "<gray>-{cost}</gray>"

unlink:
  done: "<yellow>Unlinked: <gold>{name}</gold></yellow>"
  notify-owner: "<yellow>The pair of your door「<gold>{name}</gold>」was unlinked</yellow>"
  expired-owner: "<yellow>Pair「<gold>{name}</gold>」ran out of lifetime and was unlinked (door blocks kept; re-link anytime)</yellow>"

break:
  notify-owner: "<yellow>Your door「<gold>{name}</gold>」was broken — its pair is gone</yellow>"

cmd:
  no-permission: "<red>You don't have permission for this</red>"
  not-found: "<red>No door named「<gold>{name}</gold>」found</red>"
  player-only: "<red>Players only</red>"
  player-offline: "<red>Player is offline</red>"
  invalid-hours: "<red>Invalid lifetime: enter whole hours 0–100000 (0 = permanent)</red>"
  reloaded: "<green>Config and messages reloaded (data untouched)</green>"
  renamed: "<green>Renamed: {old} → <gold>{name}</gold></green>"
  rename-length: "<red>Name must be 1–16 characters</red>"
  deleted: "<green>Deleted door record: <gold>{name}</gold></green>"
  key-given: "<green>Gave <gold>{amount}</gold> door key(s) to <gold>{player}</gold></green>"
  key-given-entity: "<green>Gave <gold>{amount}</gold> entity door key(s) to <gold>{player}</gold> (pair lifetime {lifetime})</green>"
  key-received: "<green>Received <gold>{amount}</gold> door key(s)</green>"
  key-received-entity: "<green>Received <gold>{amount}</gold> entity door key(s) — pair lifetime {lifetime}; the key never expires while unused</green>"
  list-header: "<gray>── Door pairs (<gold>{count}</gold>) ──</gray>"
  list-row: "<gray>{index}. <gold>{name}</gold> <dark_gray>({world_a} ↔ {world_b} · {uses} uses)</dark_gray></gray>"
  list-empty: "<gray>No pairs yet. Place two doors and right-click both with a key!</gray>"
  stats-mine-header: "<gray>── My stats ──</gray>"
  stats-mine: "<gray>Pairs: <gold>{pairs}</gold><dark_gray>/{limit}</dark_gray> · Total uses: <gold>{uses}</gold></gray>"
  stats-mine-line2: "<gray>Trigger: <gold>{mode}</gold> · Info: <gold>{info}</gold> · History in /ddoor gui</gray>"
  stats-header: "<gray>── Server stats ──</gray>"
  stats-total: "<gray>Total pairs: <gold>{pairs}</gold> · Doors: <gold>{doors}</gold> · Total uses: <gold>{uses}</gold></gray>"
  usage-header: "<gray>── /ddoor commands ──</gray>"
  usage-list: "<gray>/ddoor list{flags} <dark_gray>— list your pairs</dark_gray></gray>"
  usage-tp: "<gray>/ddoor tp <name> <dark_gray>— teleport to a door</dark_gray></gray>"
  usage-rename: "<gray>/ddoor rename <name> <new> <dark_gray>— rename</dark_gray></gray>"
  usage-unlink: "<gray>/ddoor unlink <name> <dark_gray>— unlink a pair</dark_gray></gray>"
  usage-link: "<gray>/ddoor link <dark_gray>— keyless linking mode</dark_gray></gray>"
  usage-gui: "<gray>/ddoor gui <dark_gray>— management menu (detail/settings/history)</dark_gray></gray>"
  usage-admin: "<gray>/ddoor delete <name> · key [normal|entity <hours>] [amount] [player] · stats · reload</gray>"

gui:
  title: "<gradient:#b388ff:#6ea8fe>DokodemoDoor · My pairs</gradient> <dark_gray>({page}/{pages})</dark_gray>"
  door-name: "<gold>{name}</gold>"
  door-lore:
    - "<gray>End A:</gray> <white>{world_a}</white> <dark_gray>({x_a}, {y_a}, {z_a} · {facing_a} · {biome_a})</dark_gray>"
    - "<gray>End B:</gray> <white>{world_b}</white> <dark_gray>({x_b}, {y_b}, {z_b} · {facing_b} · {biome_b})</dark_gray>"
    - "<gray>Created</gray> <white>{created}</white> <gray>· <white>{uses}</white> uses</gray>"
    - "<gray>Mobs:</gray> {entities}"
    - "<gray>Lifetime:</gray> {expires}"
    - ""
    - "<yellow>Left-click</yellow> <gray>teleport to this door</gray>"
    - "<yellow>Right-click</yellow> <gray>details & settings</gray>"
    - "<red>Shift+Right-click</red> <gray>unlink</gray>"
  door-lore-simple:
    - "<white>{world_a}</white> <dark_gray>↔</dark_gray> <white>{world_b}</white> <dark_gray>· {uses} uses</dark_gray>"
    - ""
    - "<yellow>Left-click</yellow> <gray>teleport</gray> <dark_gray>·</dark_gray> <yellow>Right-click</yellow> <gray>settings</gray>"
  empty-name: "<gray>No door pairs yet</gray>"
  empty-lore:
    - "<gray>Place two doors and right-click both</gray>"
    - "<gray>with a door key to link them</gray>"
  prev-name: "<yellow>← Previous</yellow>"
  next-name: "<yellow>Next →</yellow>"
  back-name: "<yellow>← Back</yellow>"
  close-name: "<red>Close</red>"
  stats-name: "<gradient:#b388ff:#6ea8fe>My stats</gradient>"
  stats-lore:
    - "<gray>Pairs:</gray> <white>{count}</white><dark_gray>/{limit}</dark_gray>"
    - "<gray>Total uses:</gray> <white>{uses}</white>"
  settings-name: "<gradient:#b388ff:#6ea8fe>Settings</gradient>"
  settings-lore:
    - "<gray>Teleport trigger / info verbosity</gray>"
    - "<yellow>Click to open</yellow>"
  settings-title: "<gradient:#b388ff:#6ea8fe>DokodemoDoor · Settings</gradient>"
  mode-name: "<gold>Teleport trigger</gold>"
  mode-lore:
    - "<gray>Current:</gray> <white>{mode}</white>"
    - ""
    - "<gray>Walk-in: walk into the frame (default)</gray>"
    - "<gray>Right-click: click the door to teleport</gray>"
    - "<gray>Left-click: click the door to teleport (sneak = vanilla)</gray>"
    - ""
    - "<yellow>Click to switch</yellow>"
  mode-walk: "Walk-in"
  mode-right: "Right-click"
  mode-left: "Left-click"
  mode-set: "<green>Teleport trigger set to: <gold>{mode}</gold></green>"
  info-mode-name: "<gold>Info display</gold>"
  info-mode-detailed: "Detailed"
  info-mode-simple: "Simple"
  info-mode-detailed-lore:
    - "<gray>Current:</gray> <white>Detailed</white>"
    - "<gray>Full coords / facing / biome / verbose errors</gray>"
    - ""
    - "<yellow>Click to switch to Simple</yellow>"
  info-mode-simple-lore:
    - "<gray>Current:</gray> <white>Simple</white>"
    - "<gray>Compact pair info / brief errors</gray>"
    - ""
    - "<yellow>Click to switch to Detailed</yellow>"
  info-mode-set: "<green>Info display set to: <gold>{mode}</gold></green>"
  detail-title: "<gradient:#b388ff:#6ea8fe>DokodemoDoor · {name}</gradient>"
  detail-end-a: "<gold>End A · this door</gold>"
  detail-end-b: "<gold>End B · other door</gold>"
  detail-end-lore:
    - "<gray>World:</gray> <white>{world}</white>"
    - "<gray>Coords:</gray> <white>{x}, {y}, {z}</white> <dark_gray>({facing})</dark_gray>"
    - "<gray>Biome:</gray> <white>{biome}</white>"
    - "<gray>Uses (this end):</gray> <white>{uses}</white>"
  detail-info-name: "<gradient:#b388ff:#6ea8fe>{name}</gradient>"
  detail-info-lore:
    - "<gray>Created:</gray> <white>{created}</white>"
    - "<gray>Total uses:</gray> <white>{uses}</white>"
    - "<gray>Mobs:</gray> {entities}"
    - "<gray>Lifetime:</gray> {expires}"
    - "<gray>Status:</gray> {status}"
  status-enabled: "<green>Enabled</green>"
  status-disabled: "<red>Disabled</red>"
  entity-on: "<green>yes (players and mobs)</green>"
  entity-off: "<dark_gray>players only</dark_gray>"
  expires-permanent: "<dark_gray>permanent</dark_gray>"
  expires-hours: "<gold>{hours}</gold>h"
  expires-minutes: "<gold>{minutes}</gold>m"
  facing-north: "north"
  facing-south: "south"
  facing-east: "east"
  facing-west: "west"
  detail-tp-a-name: "<aqua>Teleport → End A</aqua>"
  detail-tp-b-name: "<aqua>Teleport → End B</aqua>"
  detail-tp-lore:
    - "<gray>Target:</gray> <white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray>"
    - "<yellow>Click to teleport</yellow>"
  detail-rename-name: "<yellow>Rename</yellow>"
  detail-rename-lore:
    - "<gray>Type the new name in chat</gray>"
    - "<gray>after the menu closes</gray>"
    - "<yellow>Click to start</yellow>"
  detail-toggle-on-name: "<green>Pair status: enabled</green>"
  detail-toggle-on-lore:
    - "<gray>Teleporting is allowed</gray>"
    - "<red>Click to disable (pauses the pair)</red>"
  detail-toggle-off-name: "<red>Pair status: disabled</red>"
  detail-toggle-off-lore:
    - "<gray>Teleporting is blocked</gray>"
    - "<green>Click to enable</green>"
  toggle-on-done: "<green>Pair「<gold>{name}</gold>」enabled</green>"
  toggle-off-done: "<yellow>Pair「<gold>{name}</gold>」disabled — teleport paused</yellow>"
  detail-unlink-name: "<red>Unlink</red>"
  detail-unlink-lore:
    - "<gray>Breaks the connection; door blocks stay</gray>"
    - "<gray>Re-link later with a door key</gray>"
    - "<red>Click to unlink</red>"
  detail-logs-name: "<light_purple>History</light_purple>"
  detail-logs-lore:
    - "<gray>Who did what, and when</gray>"
    - "<gray>(teleport / link / unlink / break)</gray>"
    - "<yellow>Click to view</yellow>"
  rename-prompt: "<yellow>Type the new name in chat (1–16 chars), or <gold>cancel</gold> to abort</yellow>"
  rename-cancelled: "<gray>Rename cancelled</gray>"
  logs-title: "<gradient:#b388ff:#6ea8fe>History · {name}</gradient> <dark_gray>({page}/{pages})</dark_gray>"
  key-name: "<bold><gradient:#b388ff:#6ea8fe>Door Key</gradient></bold>"
  key-lore:
    - "<gray>Right-click two doors to link them</gray>"
    - "<gray>Craft:</gray> <white>Amethyst×4 + Iron×4 + Ender Eye×1</white>"
    - "<gray>Recipe unlocked in your recipe book</gray>"

logs:
  disabled: "<gray>Interaction logging is disabled by the admin</gray>"
  empty: "<gray>No recent activity</gray>"
  action-teleport: "<light_purple>Teleport</light_purple>"
  action-link: "<green>Link</green>"
  action-unlink: "<yellow>Unlink</yellow>"
  action-break: "<red>Break</red>"
  entry-lore:
    - "<gray>Action:</gray> {action}"
    - "<gray>Time:</gray> <white>{time}</white>"
    - "<gray>Location:</gray> <white>{world}</white> <dark_gray>({x}, {y}, {z})</dark_gray>"

audit:
  cleaned: "<gray>Audit complete: pruned {count} stale door records</gray>"
